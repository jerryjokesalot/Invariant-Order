[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invariant-order"
version = "0.2.0"
description = "Detect structural change, ignore nuisance drift. Mathematically guaranteed."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Jerry Becker" },
]
keywords = ["change-detection", "signal-processing", "invariant", "drift", "predictive-maintenance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy>=1.20",
]

[project.urls]
Homepage = "https://github.com/jerryjokesalot/Invariant-Order"
Repository = "https://github.com/jerryjokesalot/Invariant-Order"
Issues = "https://github.com/jerryjokesalot/Invariant-Order/issues"

[project.optional-dependencies]
full = ["scipy>=1.7", "scikit-learn>=1.0"]
ml = ["scikit-learn>=1.0"]
dev = ["pytest>=7.0", "scipy>=1.7", "scikit-learn>=1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/invariant_order"]

[tool.pytest.ini_options]
testpaths = ["tests"]
